openapi: 3.0.3
info:
  title: Mercado Uno API
  version: 0.2.0
  description: |
    API REST del marketplace educativo Mercado Uno. PostgreSQL es la base de
    producción. El checkout reserva inventario y crea un pedido y un pago
    pendientes; el proveedor simulado solo está disponible fuera de producción.
  license:
    name: Uso educativo
security: []
servers:
  - url: http://localhost:3000
    description: Stack Docker, con la API publicada por el proxy del frontend
  - url: http://localhost:4000
    description: API directa para desarrollo
tags:
  - name: Health
    description: Disponibilidad y versión del proceso HTTP.
  - name: Products
    description: Consulta pública del catálogo.
  - name: Authentication
    description: Registro, sesión y cierre mediante cookie HttpOnly.
  - name: Cart
    description: Carrito aislado del usuario autenticado.
  - name: Orders
    description: Checkout, consulta, pago simulado y cancelación.

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Consultar el estado de la API
      operationId: getHealth
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/products:
    get:
      tags: [Products]
      summary: Listar productos
      operationId: listProducts
      responses:
        "200":
          description: Catálogo completo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Obtener un producto
      operationId: getProductById
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/InvalidIdentifier"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Registrar usuario y crear sesión
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Sesión creada mediante cookie HttpOnly.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie de sesión HttpOnly, SameSite=Lax y Secure en producción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Sesión creada mediante cookie HttpOnly.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Restaurar la sesión actual
      operationId: getCurrentUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Usuario de la sesión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar la sesión actual
      operationId: logoutUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cookie eliminada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"

  /api/cart:
    get:
      tags: [Cart]
      summary: Consultar el carrito propio
      operationId: getCart
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Líneas del carrito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItemDetailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Cart]
      summary: Añadir una cantidad al carrito
      operationId: addCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartRequest"
      responses:
        "200":
          description: Carrito actualizado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItemSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cart]
      summary: Reemplazar la cantidad de una línea
      operationId: updateCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartRequest"
      responses:
        "200":
          description: Cantidad actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cart/{productId}:
    delete:
      tags: [Cart]
      summary: Eliminar una línea del carrito
      operationId: deleteCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartProductId"
      responses:
        "200":
          description: Línea eliminada o ya ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidIdentifier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"

  /api/checkout:
    post:
      tags: [Orders]
      summary: Reservar inventario y crear un pedido pendiente
      operationId: checkoutCart
      description: No cobra ni marca la orden como pagada. Una misma clave reutiliza el resultado anterior.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Pedido nuevo o reutilizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"

  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos propios
      operationId: listOrders
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos del usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Obtener un pedido propio
      operationId: getOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Pedido, líneas y resumen de pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidIdentifier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders/{orderId}/pay:
    post:
      tags: [Orders]
      summary: Ejecutar el proveedor simulado
      operationId: payOrder
      description: Solo está habilitado en desarrollo y tests; es idempotente por estado.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [paid, failed]
                  default: paid
      responses:
        "200":
          description: Resultado nuevo o reutilizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: El proveedor simulado está deshabilitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancelar un pedido y liberar su inventario una vez
      operationId: cancelOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Cancelación nueva o reutilizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMutationResponse"
        "400":
          $ref: "#/components/responses/InvalidIdentifier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOrigin"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mercado_session
      description: En producción se usa el nombre endurecido __Host-mercado_session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Compatibilidad temporal para clientes no navegador.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CartProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"

  responses:
    BadRequest:
      description: Entrada inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidIdentifier:
      description: El identificador no es un entero positivo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sesión ausente, inválida o expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidOrigin:
      description: Una mutación con cookie llegó desde un origen no autorizado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: El recurso no existe o no pertenece al usuario.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: El estado actual no permite la transición.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: El JSON supera 10 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Se superó el límite temporal de solicitudes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    HealthResponse:
      type: object
      required: [status, version, timestamp]
      properties:
        status: { type: string, example: "ok - up" }
        version: { type: string, example: "11/08/2026" }
        timestamp: { type: string, format: date-time }
    CredentialsRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-zA-Z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    PublicUser:
      type: object
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        token:
          type: string
          description: Solo aparece si ALLOW_BEARER_AUTH=true y X-Auth-Transport=bearer.
    Product:
      type: object
      required: [id, title, price, stock]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, format: double, example: 9.99 }
        stock: { type: integer, minimum: 0 }
    CartRequest:
      type: object
      required: [productId, qty]
      properties:
        productId: { type: integer, minimum: 1 }
        qty: { type: integer, minimum: 1, maximum: 100 }
    CartItemSummary:
      type: object
      required: [productId, qty]
      properties:
        productId: { type: integer }
        qty: { type: integer }
    CartItemDetailed:
      allOf:
        - $ref: "#/components/schemas/CartItemSummary"
        - type: object
          required: [product]
          properties:
            product:
              $ref: "#/components/schemas/Product"
    OrderItem:
      type: object
      required: [id, ProductId, qty, price]
      properties:
        id: { type: integer }
        ProductId: { type: integer }
        qty: { type: integer }
        price: { type: number, format: double }
    PaymentSummary:
      type: object
      nullable: true
      required: [status, provider, amountCents, currency]
      properties:
        status:
          type: string
          enum: [pending, paid, failed, cancelled, refunded]
        provider: { type: string, enum: [simulated] }
        amountCents: { type: integer, minimum: 0 }
        currency: { type: string, example: MXN }
    Order:
      type: object
      required: [id, status, total, items, payment]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pending_payment, paid, payment_failed, cancelled]
        total: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          $ref: "#/components/schemas/PaymentSummary"
    OrderMutationResponse:
      type: object
      required: [ok, replayed, order]
      properties:
        ok: { type: boolean, enum: [true] }
        orderId:
          type: integer
          description: Alias conservado en la respuesta de checkout.
        replayed: { type: boolean }
        order:
          $ref: "#/components/schemas/Order"
