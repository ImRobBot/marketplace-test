name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL + tests + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: marketplace_ci
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketplace:marketplace-ci-password@localhost:5432/marketplace_ci
      DATABASE_SSL: "false"
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Apply PostgreSQL migrations
        run: pnpm run migrate
        env:
          NODE_ENV: ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  frontend:
    name: Frontend (tests + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  containers:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose config --format json | python3 -c 'import json, sys; config = json.load(sys.stdin); actual = config["services"]["backend"]["environment"].get("NODE_ENV"); assert actual == "production", f"backend NODE_ENV must be production, got {actual!r}"'

      - name: Build and start stack
        run: docker compose up --build --detach --wait

      - name: Smoke test API and frontend security headers
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/api/products
          curl --fail --silent --show-error --head http://127.0.0.1:3000/ | grep -i "content-security-policy"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  sonarcloud:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
