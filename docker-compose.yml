services:
  backend:
    build:
      context: ./backend
    container_name: marketplace-backend
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-32-char-value-in-.env}
      CORS_ORIGIN: http://localhost:3000
      DB_STORAGE: /app/data/database.sqlite
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: marketplace-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  backend_data:
