server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae a index.html para que React Router
    # (client-side routing) resuelva la navegacion.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre (JS/CSS de Vite) pueden cachearse agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
