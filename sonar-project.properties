sonar.projectKey=marketplace-test
sonar.projectName=Marketplace Test

# Requerido por SonarCloud (no aplica a SonarQube self-hosted).
sonar.organization=imrobbot
sonar.host.url=https://sonarcloud.io
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.sqlite
sonar.sourceEncoding=UTF-8

# index.ts es solo el bootstrap de arranque (listen + manejo de error de init);
# se excluye del requisito de cobertura, practica estandar para entrypoints.
sonar.coverage.exclusions=backend/src/index.ts
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
